# The browser client and its Plugins form find the first row by package name.
# The engine starts disabled. On headless/sdk, run `/memory takeover` and
# restart DSH. On web/desktop, takeover edits a preset for new sessions.
# Keep `:` out of the engine row id. The Loader uses it to separate nested ids.
- insert:
    - id: dsh-memory-cloud-brain
      name: dsh-memory-cloud-brain
    - id: dsh-memory-cloud-brain-engine
      name: dsh-memory-cloud-brain/engine
      disabled: true
